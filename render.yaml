services:
  - type: web
    name: debuggers-blog
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python mywebsite/manage.py collectstatic --noinput &&
      python mywebsite/manage.py migrate --noinput
    startCommand: gunicorn mywebsite.wsgi --pythonpath mywebsite --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: debuggers-blog-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: debuggers-blog-db
    plan: free
