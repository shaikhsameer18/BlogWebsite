<header class="site-header">
  <div class="wrap site-header__bar">
    <a href="/" class="brand"><span class="brand__dot">&gt;_</span> debuggers<span class="brand__dot">.</span>blog</a>

    <nav class="nav" id="site-nav">
      <a href="/"{% if request.path == '/' %} class="is-active"{% endif %}>home</a>

      <div class="nav-dropdown">
        <a href="#" class="nav-dropdown__trigger" aria-haspopup="true" aria-expanded="false">categories &#9662;</a>
        <div class="nav-dropdown__menu">
          {% for cat in cats %}
          <a href="/category/{{ cat.url }}">{{ cat.title }}</a>
          {% empty %}
          <a href="#">no categories yet</a>
          {% endfor %}
        </div>
      </div>

      <a href="/about/"{% if '/about' in request.path %} class="is-active"{% endif %}>about</a>
      <a href="/admin/">admin</a>
    </nav>

    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="site-nav">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M1 4H17M1 9H17M1 14H17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>
